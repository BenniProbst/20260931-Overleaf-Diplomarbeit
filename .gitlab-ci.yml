# 20260931-overleaf-diplomarbeit (thesis, Projekt 289) — GitLab CI/CD (REV 4, 2026-09-22: Umfang-Matrix lang|kurz + Kerntext-Gate, Order 346; REV 3, 2026-08-02): §7 Hard-Gate (0 Fehler / <=1 bekannte Warning / .blg ohne Repeated-entry)
# REV 3 (CI-Wachen-Befund 02.08.): thesis:pdf baut BEIDE Sprachfassungen (parallel:matrix de+en).
#   Vorher wurde nur der \thesislang-Default (de) kompiliert; die EN-Fassung war nur chktex-gelintet
#   und damit CI-seitig unbelegt (chktex ist Linter, kein Compiler). Muster = build.ps1:
#   \def\thesislang{<lang>} vor \input, jobname diplomarbeit-<lang>. Lokal verifiziert (EN 182 S., 0 W, blg 0).
# ─────────────────────────────────────────────────────────────────────────────
# P1c (User-Wahl 2026-06-25): „Voll inkl. PDF, latexmk via Infra" — TeXLive ist Runner-Voraussetzung
# (Infra installiert texlive vor). Bis dahin sind chktex + thesis:pdf per COMDARE_TEXLIVE_AVAILABLE
# gegatet (sonst sicherer Fail an „fehlt"). gitleaks (hermetisch) laeuft sofort = harter Secrets-Gate.
#
# ⚠️ OVERLEAF-HINWEIS: Dieses Repo ist Overleaf-gekoppelt. Diese .gitlab-ci.yml lebt auf `main`.
#   Overleaf synct typischerweise eigene dated Branches (z.B. overleaf-2026-06-22-1726) -> main bleibt
#   unberuehrt. Falls dein Sync main ueberschreibt, bitte melden (die Datei ist reversibel).

include:
  - project: 'comdare/cluster/ci-templates'
    ref: development
    file: '/base-pipeline.yml'

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - lint
  - thesis-pdf
  - pdf-writeback      # REV 5 (Order 389, 22.09.2026): gegatete PDF-Fassungen als Folge-Commit in die Hauptebene

variables:
  GIT_SUBMODULE_STRATEGY: none

# ── Stufe 1: Secrets (gitleaks, hermetisch) — HART, laeuft sofort ──
lint:secrets:
  extends: .lint-secrets
  tags: [baremetal]

# ── LaTeX-Lint (chktex) — TeXLive = Infra-Voraussetzung ──
# HART seit 2026-07-06 (User-Auftrag „strikt gruen, Fehler echt beheben"): 964 Warnungen in 4 Wellen
# auf 0 (W8/W36 -> Konvention .chktexrc + 8 Jahresspannen; W13/W12 -> 203 \@-/Abkuerzungs-Markierungen;
# W1 -> 242 Command-Space-Praezisierungen; Rest -> echte Mikro-Fixes + 42 dokumentierte Suppressions).
lint:latex:
  stage: lint
  tags: [baremetal]
  needs: []
  rules:
    - if: '$COMDARE_TEXLIVE_AVAILABLE == "true"'
  script:
    - 'command -v chktex >/dev/null 2>&1 || { echo "chktex (texlive) fehlt — Infra-Voraussetzung (P1c)"; exit 1; }'
    - 'echo "== chktex ueber alle .tex =="'
    # REV2 (Codex-Befund): KEIN `|| true` mehr — chktex-Befunde bleiben sichtbar.
    # Dash-/Identifier-Konventionen des Dokuments: .chktexrc (Repo-Root, wird via CWD gelesen).
    # -n36 (Space vor/nach Klammer): alle 251 Befunde klassifiziert (2026-07-06) = ausnahmslos
    # False-Positives auf Code-Identifiern (create_anatomy(), zipfian(.99), \allowbreak-Namen)
    # und deutschen Klammer-Komposita ((Bundle-)Prefetch) — 0 echte Prosa-Spacing-Fehler.
    # -n17 (Klammer-Bilanz je Datei): einzige Quelle sind die enumitem-Labels `label=\alph*)` /
    # `label=\arabic*)` (gewolltes a)-b)-c)-Layout, 4 ungpaarte `)`); W17 ist weder zeilen- noch
    # kommentar-supprimierbar (Pseudo-Zeilen > EOF, Kommentare zaehlen nicht). Echte Klammer-Fehler
    # faengt weiterhin der thesis:pdf-Compile (halt-on-error).
    - 'find . -name "*.tex" -not -path "./_*" -print0 | xargs -0 -r chktex -q -n36 -n17'

# ── thesis-PDF (latexmk) — TeXLive = Infra-Voraussetzung ──
thesis:pdf:
  stage: thesis-pdf
  tags: [baremetal]
  needs: []
  rules:
    - if: '$COMDARE_TEXLIVE_AVAILABLE == "true"'
  parallel:
    matrix:
      - THESIS_LANG: [de, en]   # REV 3: beide Sprachfassungen sind Abgabe-Artefakte -> beide werden kompiliert und gegatet
        THESIS_UMFANG: [lang, kurz]   # REV 4 (Order 346, 22.09.2026): Umfang-Schalter -> 4 Fassungen, Kurzfassung = Abgabe
  variables:
    COMDARE_THESIS_KNOWN_WARNINGS: "0"   # war "1" (99b9a35 27.06.2026) und deckte genau die F-1-Zeile; seit #234 (M-1, Owner W-2 Shim raus) misst CI 289/16625 0/0 (R-4 (b))
    COMDARE_THESIS_KNOWN_BOXES: "0"      # Overfull/Underfull [hv]box: ab #234 gemessen 0 (FIX-r2 Abschn. 4/5, R-4 (a))
    COMDARE_THESIS_KNOWN_PKGWARN: "0"    # Package-/Class-Warning:     ab #234 gemessen 0 (FIX-r2 Abschn. 4/5, R-4 (a))
  script:
    - 'command -v latexmk >/dev/null 2>&1 || { echo "latexmk (texlive) fehlt — Infra-Voraussetzung (P1c)"; exit 1; }'
    # Sprachwahl exakt wie build.ps1: \def\thesislang{<lang>} VOR \input gewinnt gegen \providecommand (config/language.tex).
    # REV 5 (Order 389, 22.09.2026): reproduzierbare PDF-Bytes -- pdfTeX nimmt Datum/Trailer-ID aus SOURCE_DATE_EPOCH
    # (Commit-Zeit): byte-gleiche Quellen -> byte-gleiche PDFs, pdf:writeback committet nur echte Aenderungen.
    - 'export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) FORCE_SOURCE_DATE=1; echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"'
    - 'latexmk -pdf -interaction=nonstopmode -halt-on-error -jobname=diplomarbeit-${THESIS_LANG}-${THESIS_UMFANG} -usepretex="\def\thesislang{${THESIS_LANG}}\def\thesisumfang{${THESIS_UMFANG}}" diplomarbeit.tex'
    # ── §7 Hard-Gate: 0 Fehler (latexmk -halt-on-error oben) + <= bekannte Warnings + .blg ohne Repeated-entry/Warning ──
    - 'test -s diplomarbeit-${THESIS_LANG}-${THESIS_UMFANG}.log || { echo "GATE-FAIL [${THESIS_LANG}]: diplomarbeit-${THESIS_LANG}-${THESIS_UMFANG}.log fehlt (Build unvollstaendig)"; exit 1; }; W=$(grep -c "LaTeX Warning" diplomarbeit-${THESIS_LANG}-${THESIS_UMFANG}.log 2>/dev/null || true); W=${W:-0}; echo "LaTeX-Warnings=$W (erlaubt <=${COMDARE_THESIS_KNOWN_WARNINGS})"; test "$W" -le "${COMDARE_THESIS_KNOWN_WARNINGS}" || { echo "GATE-FAIL [${THESIS_LANG}]: $W LaTeX-Warnings > ${COMDARE_THESIS_KNOWN_WARNINGS} bekannte -> Dokument unordentlich"; exit 1; }'
    - 'B=$(grep -cE "^(Overfull|Underfull) \\\\[hv]box" diplomarbeit-${THESIS_LANG}-${THESIS_UMFANG}.log 2>/dev/null || true); B=${B:-0}; echo "Box-Warnungen=$B (erlaubt <=${COMDARE_THESIS_KNOWN_BOXES})"; test "$B" -le "${COMDARE_THESIS_KNOWN_BOXES}" || { echo "GATE-FAIL [${THESIS_LANG}]: $B Box-Warnungen > ${COMDARE_THESIS_KNOWN_BOXES}"; exit 1; }'
    - 'P=$(grep -cE "^(Package|Class) [A-Za-z0-9_-]+ Warning" diplomarbeit-${THESIS_LANG}-${THESIS_UMFANG}.log 2>/dev/null || true); P=${P:-0}; echo "Paket-/Klassen-Warnungen=$P (erlaubt <=${COMDARE_THESIS_KNOWN_PKGWARN})"; test "$P" -le "${COMDARE_THESIS_KNOWN_PKGWARN}" || { echo "GATE-FAIL [${THESIS_LANG}]: $P Paket-/Klassen-Warnungen > ${COMDARE_THESIS_KNOWN_PKGWARN}"; exit 1; }'
    # Nachweis-Zeile (R-4 (b)): Paketversionen stehen nur im .log, nicht im Job-Trace -> microtype-Version sichtbar machen
    - 'echo "microtype: $(grep -m1 -E "^Package: microtype " diplomarbeit-${THESIS_LANG}-${THESIS_UMFANG}.log 2>/dev/null || echo unbekannt)"'
    - 'if [ -f diplomarbeit-${THESIS_LANG}-${THESIS_UMFANG}.blg ]; then R=$(grep -ciE "Repeated entry|Warning--" diplomarbeit-${THESIS_LANG}-${THESIS_UMFANG}.blg 2>/dev/null || true); R=${R:-0}; echo "BibTeX .blg Warnings/Repeated=$R"; test "$R" -eq 0 || { echo "GATE-FAIL [${THESIS_LANG}]: .blg unsauber ($R Repeated/Warning) -> Literatur pruefen"; exit 1; }; else echo ".blg nicht vorhanden (keine BibTeX-Stufe in diesem Lauf)"; fi'
    # ── Kerntext-Gate (Order 346): Kurzfassung K1..K6 (Startseite Kapitel 1 bis vor Literaturverzeichnis) <= 88 hart, <= 80 Ziel ──
    - 'if [ "${THESIS_UMFANG}" = "kurz" ]; then T=diplomarbeit-${THESIS_LANG}-${THESIS_UMFANG}.toc; S=$(grep -m1 -E "contentsline \\{chapter\\}\\{\\\\numberline \\{1\\}" "$T" | sed -E "s/.*\\}\\{([0-9]+)\\}\\{chapter\\.1\\}.*/\\1/"); E=$(grep -m1 -E "contentsline \\{chapter\\}\\{\\\\nonumberline (Literaturverzeichnis|Bibliography)\\}" "$T" | sed -E "s/.*\\}\\{([0-9]+)\\}\\{chapter\\*\\.[0-9]+\\}.*/\\1/"); [ -n "$S" ] && [ -n "$E" ] || { echo "GATE-FAIL [${THESIS_LANG}-kurz]: toc-Anker (Kapitel 1 / Literaturverzeichnis) fehlen in $T"; exit 1; }; KT=$((E-S)); echo "Kerntext-Seiten [${THESIS_LANG}-kurz]=$KT (Seiten $S..$((E-1)); hart <=86, Zielband 60-80)"; [ "$KT" -le 86 ] || { echo "GATE-FAIL [${THESIS_LANG}-kurz]: Kerntext $KT Seiten > 86"; exit 1; }; [ "$KT" -le 80 ] || echo "WARNUNG [${THESIS_LANG}-kurz]: Kerntext $KT Seiten > 80 (Zielband 60-80)"; fi'
  artifacts:
    paths:
      - diplomarbeit-${THESIS_LANG}-${THESIS_UMFANG}.pdf
    when: always
    expire_in: 4 weeks

# ── pdf:writeback (Order 389, 22.09.2026): die vier gegateten Fassungen (de/en x lang/kurz) als Folge-Commit ──
# in die Hauptebene dieses Repos, stabile Namen diplomarbeit-<lang>-<umfang>.pdf, ueberschreibend; keine Folge-
# Pipeline ([skip ci] + -o ci.skip). Laeuft nur, wenn ALLE Matrix-Instanzen von thesis:pdf gruen sind (needs).
# main ist Maintainers-geschuetzt (der Bot darf dort nicht pushen) -> main erhaelt die PDFs per FF von development.
# Uebersteuerung (Order 288, aus ce/super per Trigger-Variable): COMDARE_THESIS_PDF_WRITEBACK=false (inert),
# COMDARE_THESIS_PDF_DIR (Zielordner), COMDARE_THESIS_PDF_FASSUNGEN (Liste). Skript: ci/pdf_writeback.sh.
pdf:writeback:
  stage: pdf-writeback
  tags: [baremetal]
  needs:
    - job: "thesis:pdf"
      artifacts: true
  rules:
    - if: '$COMDARE_TEXLIVE_AVAILABLE != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
  variables:
    GIT_DEPTH: "0"          # voller Klon: der Folge-Commit haengt an HEAD, kein Shallow-Push-Fehler
  script:
    - 'sh ci/pdf_writeback.sh'
