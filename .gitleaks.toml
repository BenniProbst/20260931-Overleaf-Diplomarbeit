# gitleaks-Konfiguration -- 20260931-overleaf-diplomarbeit (thesis, CI-Stufe lint:secrets, HART)
# LaTeX-Thesis: KEINE echten Secrets erwartet. Die 19 CI-Funde (Juli 2026) stammten aus dem getrackten,
# kompilierten PDF (Binaer als Text gescannt = Entropie-FPs) + .eps-Logo + .bib (DOIs/URLs).
# Loesung: Binaer/generierte/Nicht-Quell-Dateien allowlisten + Entropie-Regel generic-api-key
# deaktivieren (konsistent mit cache-engine/prt-art/super). Spezifische High-Confidence-Regeln
# (AWS/GitHub/SSH/private-key etc.) bleiben aktiv = echte Secrets wuerden weiter gefangen.
#
# VERHAELTNIS ZUR ZENTRALEN BASIS (ci-templates/gitleaks/gitleaks-base.toml): .lint-secrets waehlt bei
# vorhandener Projekt-toml AUSSCHLIESSLICH diese hier (-c ./.gitleaks.toml); die zentrale Basis greift
# dann NICHT. Die Basis-Bloecke sind deshalb hier dupliziert (eine der beiden erlaubten Varianten der
# Basis-Policy). Wer die Basis aendert, zieht hier nach.
# 07.09.2026 (#179, V-081/V-082): Regelsatz an ce/super/prt-art angeglichen (Basis-Allowlist der
# Pseudo-Secret-Marker + drei D6-Private-Key-Regeln), Datei ASCII-only mit hoechstens 120 Zeichen je Zeile.
title = "20260931-overleaf-diplomarbeit (thesis) gitleaks"

# --- BASIS-DUPLIKAT (gitleaks-base.toml) -------------------------------------------------------
[extend]
useDefault = true
disabledRules = ["generic-api-key"]

[[allowlists]]
description = "Binaer/generiert/Nicht-Quell (PDF/EPS/BST/CLS = kein sinnvoller Secret-Scan)"
paths = [
  '''\.pdf$''',
  '''\.eps$''',
  '''\.bst$''',
  '''\.cls$''',
  '''(^|/)literatur\.bib$''',
]

# --- BASIS-DUPLIKAT (gitleaks-base.toml) -------------------------------------------------------
[[allowlists]]
description = "Wert-basierte Pseudo-Secret-Marker (deterministische Testdaten, keine echten Secrets)"
regexTarget = "match"
regexes = [
  '''(?i)(example|dummy|sample|test|fake|placeholder)[-_]?(key|token|secret|pw|password)''',
]

# --- PROJEKT-DELTA (D6 #142, Owner-GO Block D 26.08.2026; Einbau 07.09.2026 im thesis-Lizenz-Zug #179) --
# Nackte 32-/64-Byte-Schluessel (WireGuard/X25519/Ed25519/PSK) als base64 nach Private-/Preshared-/
# Secret-Key-Wort bzw. als wg-quick-Konfigurationszeile. Anlass: der WireGuard-Private-Key in der
# super-Historie (0891fcf) wurde von KEINER Default-Regel ausser der hier deaktivierten, entropie-
# basierten generic-api-key gefangen (blinder Fleck). Regeln additiv ([extend] useDefault=true bleibt),
# kein Allowlist-Eingriff. Beleg des Entwurfs: 0 False-Positives ueber 12682 Commits/6 Historien
# (~/backups-workflow/20260825-public-gate/regelbeweis-*.log), Koeder-Suite 6/6 positiv, 0/5 negativ.
# Quelle: entwurf-gitleaks-regel-private-key-base64.toml (Bloecke woertlich uebernommen; byte-gleich zu ce
# .gitleaks.toml @ 53150058 und prt-art .gitleaks.toml @ b539d6ee).
[[rules]]
id = "private-key-base64-32byte"
description = """\
    Nackter 32-Byte-Schluessel (WireGuard/X25519/Ed25519/PSK) als 44-Zeichen-base64 nach 'Private \
    Key:', 'PrivateKey =', 'private_key=', 'PresharedKey ='"""
regex = """\
    (?i)(?:private[ _-]?key|privatekey|preshared[ _-]?key|presharedkey|psk)\\b\
    [^\\n\\r]{0,20}?[:=][ \\t]*[`'"]?([A-Za-z0-9+/]{43}=)(?:[`'"\\s,;)\\]}]|$)"""
secretGroup = 1
entropy = 4.0
keywords = ["private", "preshared", "psk"]

[[rules]]
id = "private-key-base64-64byte"
description = """\
    Nackter 64-Byte-Schluessel (Ed25519-Secret-Key libsodium, NaCl-Box-Paare) als 88-Zeichen-base64 \
    nach Private-Key-/Secret-Key-Wort"""
regex = """\
    (?i)(?:private[ _-]?key|privatekey|secret[ _-]?key|secretkey)\\b\
    [^\\n\\r]{0,20}?[:=][ \\t]*[`'"]?([A-Za-z0-9+/]{86}==)(?:[`'"\\s,;)\\]}]|$)"""
secretGroup = 1
entropy = 4.0
keywords = ["private", "secret"]

[[rules]]
id = "wireguard-conf-privatekey"
description = """\
    WireGuard-/wg-quick-Konfigurationszeile PrivateKey = / PresharedKey = (Datei-Form, auch ohne \
    Wort 'private' im Umfeld)"""
regex = '''(?m)^[ \t]*(?:PrivateKey|PresharedKey)[ \t]*=[ \t]*([A-Za-z0-9+/]{43}=)[ \t]*$'''
secretGroup = 1
entropy = 4.0
keywords = ["privatekey", "presharedkey"]
